<html data-composition-variables='[
  {"id":"type","type":"enum","label":"Exit","default":"fall","options":[{"value":"fall","label":"fall off the bottom (v07, v08)"},{"value":"push","label":"push out to the left (v03)"},{"value":"fade-blur","label":"fade with blur (v01, v02)"}]},
  {"id":"x","type":"number","label":"Left (px)","default":90},
  {"id":"y","type":"number","label":"Top (px)","default":560},
  {"id":"w","type":"number","label":"Width (px)","default":900},
  {"id":"title","type":"string","label":"Title of the leaving card","default":"Before"},
  {"id":"body","type":"string","label":"Body of the leaving card","default":"Rounded cards, one radius, the same grey shadow."},
  {"id":"next_title","type":"string","label":"Title of the arriving card (empty = no next card)","default":"After"},
  {"id":"next_body","type":"string","label":"Body of the arriving card","default":"One typeface with a point of view, and real color."},
  {"id":"exit_at","type":"number","label":"The exit starts (s)","default":0.8},
  {"id":"fall_frames","type":"number","label":"Fall frames","default":10},
  {"id":"fall_tilt","type":"number","label":"Fall tilt (degrees)","default":2},
  {"id":"push_frames","type":"number","label":"Push-out frames","default":6},
  {"id":"gap_frames","type":"number","label":"Empty frames after the push","default":2},
  {"id":"in_frames","type":"number","label":"Entrance frames of the next card after a push","default":12},
  {"id":"blur_frames","type":"number","label":"Fade-blur frames","default":4}
]'>
<template>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* exit-move (vocabulary.md 21, Exit fall or push; open question 3): clears a scene with motion instead of a cut.
       Fall off the bottom over 10 frames, ease-in, tilting about 2 degrees (v07, v08); push 6 frames out to the left,
       ease-in, 2 empty frames, then the next card enters over 12 frames expo-out (v03); or the look refs' fade with
       blur over 4 frames. The next card rises at once after a fall (v07). The scene change is the transition sound. */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    .xm-card { padding: 48px 52px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; }
  </style>
  <div id="root" data-composition-id="exit-move" data-width="1080" data-height="1920">
    <div id="xm-leaving" class="pc-card pc-el xm-card"><div id="xm-title" class="pc-title"></div><div id="xm-body" class="pc-body"></div></div>
    <div id="xm-next" class="pc-card pc-el xm-card" style="display: none"><div id="xm-next-title" class="pc-title"></div><div id="xm-next-body" class="pc-body"></div></div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script>
    (function () {
      var v = PC.vars({ type: "fall", x: 90, y: 560, w: 900, title: "", body: "", next_title: "", next_body: "", exit_at: 0.8, fall_frames: 10, fall_tilt: 2, push_frames: 6,
        gap_frames: 2, in_frames: 12, blur_frames: 4 }, window.__hyperframes.getVariables());
      var leaving = document.getElementById("xm-leaving"), next = document.getElementById("xm-next");
      PC.place(leaving, { x: v.x, y: v.y, w: v.w }); PC.place(next, { x: v.x, y: v.y, w: v.w });
      document.getElementById("xm-title").textContent = v.title; document.getElementById("xm-body").textContent = v.body;
      var tl = gsap.timeline({ paused: true });
      tl.set(leaving, { opacity: 1 }, 0);
      var gone;
      if (v.type === "push") gone = PC.exit(tl, leaving, v.exit_at, "push", { frames: v.push_frames });
      else if (v.type === "fade-blur") gone = PC.exit(tl, leaving, v.exit_at, "fade-blur", { frames: v.blur_frames });
      else gone = PC.exit(tl, leaving, v.exit_at, "fall", { frames: v.fall_frames, tilt: v.fall_tilt });
      PC.event("scene_change", v.exit_at, { type: v.type, end: gone });
      if (v.next_title || v.next_body) {
        next.style.display = "flex";
        document.getElementById("xm-next-title").textContent = v.next_title; document.getElementById("xm-next-body").textContent = v.next_body;
        if (v.type === "push") {
          var at = gone + PC.f(v.gap_frames);
          tl.fromTo(next, { x: 1200, opacity: 1 }, { x: 0, duration: PC.f(v.in_frames), ease: "expo.out" }, at);
          PC.event("enter", at, { el: "xm-next", move: "push-in" });
        } else if (v.type === "fade-blur") {
          PC.enter(tl, next, gone, { rise: 38 });
        } else {
          PC.enter(tl, next, v.exit_at, { rise: 38 });  // the next card rises at once (v07)
        }
      }
      window.__timelines["exit-move"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
</html>
