<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="file:///C:/Users/there/OneDrive/Desktop/instagramReels/motion-lib/">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; } #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines = {}; window.__hfVars = {"x": 240, "y": 560, "w": 600, "color": "#DC6532", "name": "Burnt orange", "hex": "", "swatch_h": 520, "enter": "rise", "enter_at": 0, "fill_at": 0.25, "type_at": 0.7, "honesty": "none", "hold": "normal", "exit": "none", "exit_at": -1};
window.__hyperframes = { getVariables: function () { return Object.assign({}, window.__hfVars); } };
window.__pcEvents = [];
</script>
</head>
<body>
<div id="stage">

  
  <style>
    /* paper-canvas: the background of every reel (style.md Canvas): paper, a warm glow top left, a warm glow lower
       right (open question 8: v02), darker bottom corners, a dot grid. From M14 it carries life (Motion and energy
       rules E5 and E7): the edge filler layer (soft cards, chips, thumbnails, shapes and stars 30 to 70 percent outside
       the left and right borders, behind the content, quieter than it, at most 20 px per second, no text) and the
       ambient layer (stars, dots and small clouds in the palette, a slow drift and twinkle), both seeded per reel and
       kept out of every text zone (tokens.json motion.grammar.text_zones). Mounted for the whole reel at z 0. */
    #paper-root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #paper-base { position: absolute; inset: 0; background: var(--c-paper); }
    #paper-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 820px 980px at 0px 0px, var(--c-glow-warm) 0%, rgba(236, 210, 190, 0.6) 42%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 760px 900px at 1080px 1560px, var(--c-glow-lower) 0%, rgba(240, 217, 199, 0.5) 45%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 420px 300px at 0px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%),
        radial-gradient(ellipse 420px 300px at 1080px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%);
    }
    #paper-dots {
      position: absolute; inset: 0; opacity: 0.85;
      background-image: radial-gradient(circle, var(--c-dot) calc(var(--dot-size) / 2), rgba(0, 0, 0, 0) calc(var(--dot-size) / 2 + 0.6px));
      background-size: var(--dot-spacing) var(--dot-spacing);
      background-position: calc(var(--dot-spacing) / 2) calc(var(--dot-spacing) / 2);
    }
  </style>
  <div id="paper-root" data-composition-id="paper-canvas" data-width="1080" data-height="1920">
    <div id="paper-base"></div>
    <div id="paper-glow"></div>
    <div id="paper-dots"></div>
  </div>
  
  
  
<link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* swatch-card (Motion and energy rules E8): one color as a card, like a paint chip: the swatch fills from the bottom
       (10 frames, power3.out), the name rises under it and the hex code types in (2 frames per character: a setter tween).
       The card lives like every element: the card enter with the zoom and parallax turn, the inertia, the hold; the swatch
       and the texts sit at their own depths (E6). */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #sc { box-sizing: border-box; padding: 26px 26px 34px; }
    #sc-sw { position: relative; border-radius: 22px; overflow: hidden; background: var(--c-surface-chrome); box-shadow: inset 0 0 0 2px var(--c-card-edge); }
    #sc-fill { position: absolute; inset: 0; transform-origin: 50% 100%; }
    #sc-name { margin-top: 26px; font-weight: 800; font-size: 56px; line-height: 1.1; letter-spacing: -0.02em; }
    #sc-hex { margin-top: 8px; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 40px; color: var(--c-ink); opacity: 0.72; min-height: 52px; }
  </style>
  <div id="root" data-composition-id="swatch-card" data-width="1080" data-height="1920">
    <div id="sc" class="pc-card pc-el"><div id="sc-sw"><div id="sc-fill"></div></div><div id="sc-name"></div><div id="sc-hex"></div></div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 240, y: 560, w: 600, color: "#DC6532", name: "Burnt orange", hex: "", swatch_h: 520, enter: "rise", enter_at: 0, fill_at: 0.25, type_at: 0.7,
        honesty: "none", hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var card = document.getElementById("sc"), sw = document.getElementById("sc-sw"), fill = document.getElementById("sc-fill"), nm = document.getElementById("sc-name"), hx = document.getElementById("sc-hex");
      PC.place(card, { x: v.x, y: v.y, w: v.w });
      sw.style.height = v.swatch_h + "px"; fill.style.background = v.color; nm.textContent = v.name;
      var code = v.hex || v.color;
      PC.honesty(card, v.honesty, { top: -50, right: 0 });
      PCM.depth(card, [sw, nm, hx]);
      var tl = gsap.timeline({ paused: true });
      var exit = { type: v.exit, at: v.exit_at };
      var main = v.enter === "pop" ? { kind: "pop", overshoot: 0.03, frames: 8, rotate: 10 } : v.enter === "none" ? { kind: "none" } : { kind: "rise", rise: 38 };
      var life = PCM.life(tl, card, { at: v.enter_at, main: main, hold: v.hold, exit: exit });
      var fillAt = Math.max(life.land - PC.f(4), v.enter_at + v.fill_at);
      PCM.grow(tl, fill, fillAt, { axis: "y", frames: 10, event: "fill" });
      PCM.appear(tl, nm, fillAt + PC.f(6), { frames: 7, rise: 26 });
      PCM.typeInto(tl, hx, code, Math.max(fillAt + PC.f(10), v.enter_at + v.type_at), { framesPerChar: 2 });
      window.__timelines["swatch-card"] = tl;
      tl.seek(0);
    })();
  </script>
</div>

<script>
(function () {
  var id = "swatch-card", duration = 3;
  var tl = window.__timelines[id];
  var start = performance.now();
  function tick() {
    var t = ((performance.now() - start) / 1000) % duration;
    if (tl) tl.seek(t, false);
    try { window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: t, waitUntil: function () {} } })); } catch (e) {}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
