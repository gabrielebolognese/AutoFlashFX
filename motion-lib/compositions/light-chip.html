<html data-composition-variables='[
         {"id":"x","type":"number","label":"Left (px)","default":120},
         {"id":"y","type":"number","label":"Top (px)","default":500},
         {"id":"text","type":"string","label":"Text","default":"video AI"},
         {"id":"enter_at","type":"number","label":"Enter at (s)","default":0},
         {"id":"fade_frames","type":"number","label":"Fade frames","default":4},
         {"id":"drift","type":"number","label":"Drift distance (px)","default":10},
         {"id":"exit","type":"enum","label":"Exit","default":"none","options":[{"value":"none","label":"none"},{"value":"fade-blur","label":"fade-blur"},{"value":"fall","label":"fall"},{"value":"push","label":"push"},{"value":"cut","label":"cut"}]},
         {"id":"exit_at","type":"number","label":"Exit at (s, -1 = never)","default":-1}
       ]'>
<template>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* light-chip (vocabulary.md 6, Light pill or chip): a label inside or above a card, surface fill, ink text, 67 tall;
       fades in over 4 frames with a small drift (v03 label pill). */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
  </style>
  <div id="root" data-composition-id="light-chip" data-width="1080" data-height="1920">
    <div id="lchip" class="pc-light-chip pc-el"><span id="lchip-text"></span></div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 120, y: 500, text: "video AI", enter_at: 0, fade_frames: 4, drift: 10, exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var chip = document.getElementById("lchip");
      PC.place(chip, v);
      document.getElementById("lchip-text").textContent = v.text;
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(chip, { opacity: 0, y: v.drift }, { opacity: 1, y: 0, duration: PC.f(v.fade_frames), ease: "power2.out" }, v.enter_at);
      PC.event("enter", v.enter_at, { el: "lchip" });
      PC.exit(tl, chip, v.exit_at, v.exit);
      window.__timelines["light-chip"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
</html>
