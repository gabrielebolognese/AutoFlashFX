<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="file:///C:/Users/there/OneDrive/Desktop/instagramReels/motion-lib/">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; } #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines = {}; window.__hfVars = {"x": 90, "y": 620, "w": 900, "h": 420, "colors_json": [{"color": "#DC6532", "at": 0.8}, {"color": "#1C110F", "at": 1.4}, {"color": "#F5EEE3", "at": 2.0}, {"color": "#289C5C", "at": 2.6}], "gap": 16, "fill_frames": 10, "enter_at": 0, "honesty": "none", "hold": "normal", "exit": "none", "exit_at": -1};
window.__hyperframes = { getVariables: function () { return Object.assign({}, window.__hfVars); } };
window.__pcEvents = [];
</script>
</head>
<body>
<div id="stage">

  
  <style>
    /* paper-canvas: the background of every reel (style.md Canvas): paper, a warm glow top left, a warm glow lower
       right (open question 8: v02), darker bottom corners, a dot grid. From M14 it carries life (Motion and energy
       rules E5 and E7): the edge filler layer (soft cards, chips, thumbnails, shapes and stars 30 to 70 percent outside
       the left and right borders, behind the content, quieter than it, at most 20 px per second, no text) and the
       ambient layer (stars, dots and small clouds in the palette, a slow drift and twinkle), both seeded per reel and
       kept out of every text zone (tokens.json motion.grammar.text_zones). Mounted for the whole reel at z 0. */
    #paper-root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #paper-base { position: absolute; inset: 0; background: var(--c-paper); }
    #paper-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 820px 980px at 0px 0px, var(--c-glow-warm) 0%, rgba(236, 210, 190, 0.6) 42%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 760px 900px at 1080px 1560px, var(--c-glow-lower) 0%, rgba(240, 217, 199, 0.5) 45%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 420px 300px at 0px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%),
        radial-gradient(ellipse 420px 300px at 1080px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%);
    }
    #paper-dots {
      position: absolute; inset: 0; opacity: 0.85;
      background-image: radial-gradient(circle, var(--c-dot) calc(var(--dot-size) / 2), rgba(0, 0, 0, 0) calc(var(--dot-size) / 2 + 0.6px));
      background-size: var(--dot-spacing) var(--dot-spacing);
      background-position: calc(var(--dot-spacing) / 2) calc(var(--dot-spacing) / 2);
    }
  </style>
  <div id="paper-root" data-composition-id="paper-canvas" data-width="1080" data-height="1920">
    <div id="paper-base"></div>
    <div id="paper-glow"></div>
    <div id="paper-dots"></div>
  </div>
  
  
  
<link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* swatch-row (Motion and energy rules E8, bars that fill): a row of color swatches that fill in on the spoken words (each one
       rises from the bottom of its slot over 10 frames, power3.out, with a small overshoot of its slot), then breathe and
       drift as one group (E1). A label (a name or a hex code) is optional and counts as text. The swatches show the colors
       the reel talks about: they are content, not the style's palette. */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #sr { display: flex; }
    .sr-slot { position: relative; flex: 1 1 0; border-radius: 26px; background: var(--c-surface); box-shadow: 0 0 0 var(--card-edge) var(--c-card-edge), 0 18px 26px -8px rgba(133, 112, 92, 0.32); overflow: hidden; }
    .sr-fill { position: absolute; left: 0; right: 0; bottom: 0; top: 0; transform-origin: 50% 100%; }
    .sr-label { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 30px; color: #FFFFFF; mix-blend-mode: normal; text-shadow: 0 0 6px rgba(0, 0, 0, 0.35); }
  </style>
  <div id="root" data-composition-id="swatch-row" data-width="1080" data-height="1920">
    <div id="sr-wrap" class="pc-el"><div id="sr"></div></div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 90, y: 620, w: 900, h: 420, colors_json: [], gap: 16, fill_frames: 10, enter_at: 0, honesty: "none", hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var wrap = document.getElementById("sr-wrap"), row = document.getElementById("sr");
      PC.place(wrap, { x: v.x, y: v.y, w: v.w, h: v.h });
      row.style.gap = v.gap + "px"; row.style.height = v.h + "px";
      var items = (Array.isArray(v.colors_json) ? v.colors_json : []).filter(function (c) { return c && typeof c.color === "string"; }).slice(0, 8);
      if (!items.length) items = [{ color: "#DC6532", at: 0.3 }, { color: "#1C110F", at: 0.9 }, { color: "#F5EEE3", at: 1.5 }];
      var slots = items.map(function (it, i) {
        var s = PC.el("div", "sr-slot", row); s.id = "sr-slot-" + i;
        var f = PC.el("div", "sr-fill", s); f.id = "sr-fill-" + i; f.style.background = it.color;
        if (it.label) PC.el("div", "sr-label", s, String(it.label));
        return { slot: s, fill: f };
      });
      var honesty = PC.honesty(wrap, v.honesty, { top: -50, right: 0 });
      PCM.depth(wrap, [row]);
      gsap.set(row, { transformStyle: "preserve-3d" });
      var tl = gsap.timeline({ paused: true });
      var exit = { type: v.exit, at: v.exit_at };
      var quiet = { move: 0, scale: 0, rotate: 0 };
      var group = PCM.life(tl, wrap, { at: v.enter_at, main: { kind: "rise", rise: 30 }, hold: v.hold, inertia: { move: 14, scale: 0.02, rotate: 1.5 }, exit: exit });
      items.forEach(function (it, i) {
        var at = Math.max(v.enter_at + PC.f(4), v.enter_at + (it.at || 0.3 + 0.5 * i));
        var s = slots[i];
        PCM.prepare(s.slot);
        gsap.set(s.slot, { z: (i % 2) * 14, force3D: true });
        PCM.grow(tl, s.fill, at, { axis: "y", frames: v.fill_frames, event: "fill" });
        PCM.pulse(tl, s.slot, at, { up: 5, down: 8, amp: 0.05 });
        // a swatch breathes on after it filled: a slow sway of its slot, a few px and a turn of 1.6 degrees (never still)
        PCM.sway(tl, s.slot, "y", 0, 7, 2.8 + 0.25 * i, 0.15 * i, Math.max(1, group.until - at), at + PC.f(10));
        PCM.sway(tl, s.slot, "rotation", 0, 1.6, 3.1 + 0.3 * i, 0.2 * i, Math.max(1, group.until - at), at + PC.f(10));
      });
      if (honesty) PCM.life(tl, honesty, { at: v.enter_at, main: { kind: "fade", frames: 4, rise: 0, zoom: false, rotate: false }, hold: { kind: "none" }, inertia: quiet, until: v.enter_at + PC.f(1), events: { enter: "honesty" } });
      window.__timelines["swatch-row"] = tl;
      tl.seek(0);
    })();
  </script>
</div>

<script>
(function () {
  var id = "swatch-row", duration = 4;
  var tl = window.__timelines[id];
  var start = performance.now();
  function tick() {
    var t = ((performance.now() - start) / 1000) % duration;
    if (tl) tl.seek(t, false);
    try { window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: t, waitUntil: function () {} } })); } catch (e) {}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
