<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="file:///C:/Users/there/OneDrive/Desktop/instagramReels/motion-lib/">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; } #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines = {}; window.__hfVars = {"x": 90, "y": 560, "w": 900, "h": 0, "title": "Clients spot it instantly", "body": "Rounded cards, one radius, the same grey shadow on every site.", "image": "", "image_h": 520, "align": "left", "enter": "rise", "enter_at": 0, "rise": 38, "exit": "fade-blur", "exit_at": 2.6, "mascot": "star", "mascot_corner": "top-right", "honesty": "none", "tilt": 0};
window.__hyperframes = { getVariables: function () { return Object.assign({}, window.__hfVars); } };
window.__pcEvents = [];
</script>
</head>
<body>
<div id="stage">

  
  <style>
    /* paper-canvas: the background of every reel (style.md Canvas): paper, a warm glow top left, a warm glow lower
       right (open question 8: v02), darker bottom corners, a dot grid. Static: no timeline. */
    #paper-root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #paper-base { position: absolute; inset: 0; background: var(--c-paper); }
    #paper-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 820px 980px at 0px 0px, var(--c-glow-warm) 0%, rgba(236, 210, 190, 0.6) 42%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 760px 900px at 1080px 1560px, var(--c-glow-lower) 0%, rgba(240, 217, 199, 0.5) 45%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 420px 300px at 0px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%),
        radial-gradient(ellipse 420px 300px at 1080px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%);
    }
    #paper-dots {
      position: absolute; inset: 0; opacity: 0.85;
      background-image: radial-gradient(circle, var(--c-dot) calc(var(--dot-size) / 2), rgba(0, 0, 0, 0) calc(var(--dot-size) / 2 + 0.6px));
      background-size: var(--dot-spacing) var(--dot-spacing);
      background-position: calc(var(--dot-spacing) / 2) calc(var(--dot-spacing) / 2);
    }
  </style>
  <div id="paper-root" data-composition-id="paper-canvas" data-width="1080" data-height="1920" data-no-timeline>
    <div id="paper-base"></div>
    <div id="paper-glow"></div>
    <div id="paper-dots"></div>
  </div>
  
  
<link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* card (vocabulary.md 1, Card enter): a surface card with an optional title, body and image. The default move for
       anything new: opacity 0 to 1 over 5 frames, y +38 to 0 over 8 frames, expo.out (style.md Motion, Enter). */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #card-box { padding: 48px 52px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; }
    #card-image { width: 100%; overflow: hidden; border-radius: 18px; display: none; background: var(--c-surface-chrome); }
    #card-image img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    #card-title { display: none; }
    #card-body { display: none; }
    #card-mascot { position: absolute; display: none; }
  </style>
  <div id="root" data-composition-id="card" data-width="1080" data-height="1920">
    <div id="card-box" class="pc-card pc-el">
      <div id="card-image"><img id="card-img" alt=""></div>
      <div id="card-title" class="pc-title"></div>
      <div id="card-body" class="pc-body"></div>
    </div>
    <div id="card-mascot" class="pc-mascot pc-el"></div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 90, y: 560, w: 900, h: 0, title: "", body: "", image: "", image_h: 520, align: "left", enter: "rise",
        enter_at: 0, rise: 38, exit: "none", exit_at: -1, mascot: "", mascot_corner: "top-right", honesty: "none", tilt: 0 }, window.__hyperframes.getVariables());
      var box = document.getElementById("card-box");
      PC.place(box, v);
      box.style.textAlign = v.align;
      if (v.title) { var t = document.getElementById("card-title"); t.textContent = v.title; t.style.display = "block"; }
      if (v.body) { var b = document.getElementById("card-body"); b.textContent = v.body; b.style.display = "block"; }
      if (v.image) {
        var wrap = document.getElementById("card-image");
        document.getElementById("card-img").src = v.image;
        wrap.style.height = v.image_h + "px"; wrap.style.display = "block";
      }
      if (v.tilt) box.style.rotate = v.tilt + "deg";
      PC.honesty(box, v.honesty);

      var tl = gsap.timeline({ paused: true });
      var landAt = v.enter_at;
      if (v.enter === "rise") landAt = PC.enter(tl, box, v.enter_at, { rise: v.rise });
      else if (v.enter === "fly-in") landAt = PC.flyIn(tl, box, v.enter_at, { dy: 930, tilt: 3.9, frames: 14 });
      else if (v.enter === "pop") landAt = PC.pop(tl, box, v.enter_at, { overshoot: 0.02, frames: 7 });
      else tl.set(box, { opacity: 1 }, 0);

      if (v.mascot) {
        var m = document.getElementById("card-mascot");
        m.innerHTML = PC.mascotSVG(v.mascot, getComputedStyle(document.documentElement).getPropertyValue("--c-mascot").trim());
        m.style.display = "block";
        var mw = 85, mh = 58;
        m.style.left = (v.x + v.w - mw * 0.55) + "px";
        if (v.mascot_corner === "bottom-right") {
          m.style.top = (v.y + (v.h || box.offsetHeight) - mh * 0.6) + "px";
        } else {
          m.style.top = (v.y - mh * 0.55) + "px";
        }
        PC.mascotEnter(tl, m, landAt);
        if (v.exit !== "none" && v.exit_at >= 0) PC.exit(tl, m, v.exit_at, v.exit);
      }
      PC.exit(tl, box, v.exit_at, v.exit);
      window.__timelines["card"] = tl;
      tl.seek(0);
    })();
  </script>
</div>

<script>
(function () {
  var id = "card", duration = 3;
  var tl = window.__timelines[id];
  var start = performance.now();
  function tick() {
    var t = ((performance.now() - start) / 1000) % duration;
    if (tl) tl.seek(t, false);
    try { window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: t, waitUntil: function () {} } })); } catch (e) {}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
