<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="file:///C:/Users/there/OneDrive/Desktop/instagramReels/motion-lib/">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; } #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines = {}; window.__hfVars = {"x": 500, "y": 900, "prop": "clapper", "move": "hop", "enter_at": 0.3, "frames": 4, "scale": 3, "flip": false, "exit": "none", "exit_at": -1};
window.__hyperframes = { getVariables: function () { return Object.assign({}, window.__hfVars); } };
window.__pcEvents = [];
</script>
</head>
<body>
<div id="stage">

  
  <style>
    /* paper-canvas: the background of every reel (style.md Canvas): paper, a warm glow top left, a warm glow lower
       right (open question 8: v02), darker bottom corners, a dot grid. Static: no timeline. */
    #paper-root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #paper-base { position: absolute; inset: 0; background: var(--c-paper); }
    #paper-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 820px 980px at 0px 0px, var(--c-glow-warm) 0%, rgba(236, 210, 190, 0.6) 42%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 760px 900px at 1080px 1560px, var(--c-glow-lower) 0%, rgba(240, 217, 199, 0.5) 45%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 420px 300px at 0px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%),
        radial-gradient(ellipse 420px 300px at 1080px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%);
    }
    #paper-dots {
      position: absolute; inset: 0; opacity: 0.85;
      background-image: radial-gradient(circle, var(--c-dot) calc(var(--dot-size) / 2), rgba(0, 0, 0, 0) calc(var(--dot-size) / 2 + 0.6px));
      background-size: var(--dot-spacing) var(--dot-spacing);
      background-position: calc(var(--dot-spacing) / 2) calc(var(--dot-spacing) / 2);
    }
  </style>
  <div id="paper-root" data-composition-id="paper-canvas" data-width="1080" data-height="1920" data-no-timeline>
    <div id="paper-base"></div>
    <div id="paper-glow"></div>
    <div id="paper-dots"></div>
  </div>
  
  
<link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* mascot (vocabulary.md 4): the recurring pixel creature, about 85 x 58 px, body in the mascot color, one prop. It
       perches on a corner of the scene's main element (the plan places it at x, y overlapping the edge) and enters 4
       frames after the card lands, rising from below over 4 frames (v02); on the end card it walks or hops. */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #ms-wrap { transform-origin: 50% 100%; }
    #ms-wrap.flip svg { transform: scaleX(-1); }
  </style>
  <div id="root" data-composition-id="mascot" data-width="1080" data-height="1920">
    <div id="ms-wrap" class="pc-mascot pc-el"></div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 880, y: 520, prop: "clapper", move: "rise", enter_at: 0, frames: 4, scale: 1, flip: false, exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var m = document.getElementById("ms-wrap");
      m.innerHTML = PC.mascotSVG(v.prop, getComputedStyle(document.documentElement).getPropertyValue("--c-mascot").trim());
      PC.place(m, { x: v.x, y: v.y });
      if (v.scale !== 1) { m.style.width = (85 * v.scale) + "px"; m.style.height = (58 * v.scale) + "px"; }
      if (v.flip) m.classList.add("flip");
      var tl = gsap.timeline({ paused: true });
      var at = v.enter_at;
      if (v.move === "pop") {
        PC.pop(tl, m, at, { overshoot: 0.16, frames: Math.max(3, v.frames), from: 0.4 });
      } else if (v.move === "hop") {
        // hop 72 up and back over 11 frames, 5 up and 6 down (v09)
        tl.fromTo(m, { opacity: 0 }, { opacity: 1, duration: PC.f(2), ease: "none" }, at);
        tl.fromTo(m, { y: 0 }, { y: -72, duration: PC.f(5), ease: "power2.out" }, at);
        tl.to(m, { y: 0, duration: PC.f(6), ease: "power2.in" }, at + PC.f(5));
        PC.event("mascot", at, { el: "ms-wrap", move: "hop" });
      } else if (v.move === "walk") {
        tl.fromTo(m, { x: -260, opacity: 0 }, { opacity: 1, duration: PC.f(3), ease: "none" }, at);
        tl.to(m, { x: 0, duration: PC.f(14), ease: "power2.out" }, at);
        tl.to(m, { y: -5, duration: PC.f(3), ease: "power1.inOut", yoyo: true, repeat: 3 }, at);
        PC.event("mascot", at, { el: "ms-wrap", move: "walk" });
      } else {
        tl.fromTo(m, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: PC.f(v.frames), ease: "power2.out" }, at);
        PC.event("mascot", at, { el: "ms-wrap", move: "rise" });
      }
      PC.exit(tl, m, v.exit_at, v.exit);
      window.__timelines["mascot"] = tl;
      tl.seek(0);
    })();
  </script>
</div>

<script>
(function () {
  var id = "mascot", duration = 3;
  var tl = window.__timelines[id];
  var start = performance.now();
  function tick() {
    var t = ((performance.now() - start) / 1000) % duration;
    if (tl) tl.seek(t, false);
    try { window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: t, waitUntil: function () {} } })); } catch (e) {}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
